<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="smile-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </radialGradient>
    <radialGradient id="iris-grad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#082b59" />
    </radialGradient>
    <radialGradient id="blush-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="hair-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="40%" stop-color="#3f3f46" />
      <stop offset="60%" stop-color="#18181b" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#082b59" flood-opacity="0.1" />
    </filter>
  </defs>



  <!-- Back Hair -->
  <path d="M 68 110 C 60 160 70 200 85 220 L 155 220 C 170 200 180 160 172 110 Z" fill="#18181b" />

  <!-- Hoodie Shoulder & Collar -->
  <g filter="url(#soft-shadow)">
    <!-- Hood back curve -->
    <path d="M 64 165 C 55 180 40 220 35 240 L 205 240 C 200 220 185 180 176 165 C 160 178 140 185 120 185 C 100 185 80 178 64 165 Z" fill="url(#hoodie-grad)" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Hoodie trim & zipper -->
    <path d="M 120 182 L 120 240" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <!-- Zipper pull -->
    <rect x="117.5" y="184" width="5" height="8" rx="1.5" fill="#082b59" />
    <!-- Drawstrings -->
    <path d="M 102 184 Q 98 205 100 216" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="100" cy="217" r="2.5" fill="#06b6d4" />
    <path d="M 138 184 Q 142 205 140 216" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="140" cy="217" r="2.5" fill="#06b6d4" />
    <!-- Collar Fold -->
    <path d="M 78 160 Q 95 182 120 183 Q 145 182 162 160 Q 142 166 120 166 Q 98 166 78 160 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Neck -->
  <path d="M 108 140 L 108 165 Q 120 170 132 165 L 132 140 Z" fill="#fde2d2" />
  <path d="M 108 145 Q 120 152 132 145 L 132 140 L 108 140 Z" fill="#f9c7af" opacity="0.5" />

  <!-- Face -->
  <path d="M 76 96 C 76 68 95 54 120 54 C 145 54 164 68 164 96 C 164 124 150 148 120 150 C 90 148 76 124 76 96 Z" fill="#fef0e7" />

  <!-- Blush on Cheeks -->
  <ellipse cx="90" cy="118" rx="11" ry="6" fill="url(#blush-grad)" />
  <ellipse cx="150" cy="118" rx="11" ry="6" fill="url(#blush-grad)" />

  <!-- Cute Nose -->
  <circle cx="120" cy="115" r="1.2" fill="#e79c88" />

  <!-- Mouth: Gentle Happy Smile -->
  <path d="M 113 126 Q 120 133 127 126" stroke="#be5a58" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Left Eye -->
  <g id="left-eye">
    <!-- Eyebrow -->
    <path d="M 86 89 Q 98 84 105 88" stroke="#27272a" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Eyelash / eyelid -->
    <path d="M 84 99 Q 96 92 108 97" stroke="#18181b" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <!-- Sclera -->
    <path d="M 87 99 C 87 96 105 96 105 99 C 105 114 87 114 87 99 Z" fill="#ffffff" />
    <!-- Iris -->
    <ellipse cx="96" cy="104" rx="7.5" ry="8" fill="url(#iris-grad)" />
    <!-- Pupil -->
    <ellipse cx="96" cy="104" rx="4" ry="4.5" fill="#082b59" />
    <!-- Catchlights -->
    <circle cx="93.5" cy="101" r="2.4" fill="#ffffff" />
    <circle cx="98" cy="106.5" r="1.2" fill="#ffffff" />
    <!-- Bottom line -->
    <path d="M 89 111 Q 97 113 103 110" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Eye -->
  <g id="right-eye">
    <!-- Eyebrow -->
    <path d="M 135 88 Q 142 84 154 89" stroke="#27272a" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Eyelash / eyelid -->
    <path d="M 132 97 Q 144 92 156 99" stroke="#18181b" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <!-- Sclera -->
    <path d="M 135 99 C 135 96 153 96 153 99 C 153 114 135 114 135 99 Z" fill="#ffffff" />
    <!-- Iris -->
    <ellipse cx="144" cy="104" rx="7.5" ry="8" fill="url(#iris-grad)" />
    <!-- Pupil -->
    <ellipse cx="144" cy="104" rx="4" ry="4.5" fill="#082b59" />
    <!-- Catchlights -->
    <circle cx="141.5" cy="101" r="2.4" fill="#ffffff" />
    <circle cx="146" cy="106.5" r="1.2" fill="#ffffff" />
    <!-- Bottom line -->
    <path d="M 137 110 Q 143 113 151 111" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Front Hair & Bangs -->
  <g id="front-hair">
    <!-- Top Hair Volume -->
    <path d="M 72 90 C 70 50 90 35 120 35 C 150 35 170 50 168 90 C 160 62 145 48 120 48 C 95 48 80 62 72 90 Z" fill="#18181b" />
    <!-- Hair Gloss / Highlight Band -->
    <path d="M 82 58 Q 120 49 158 58 Q 145 52 120 52 Q 95 52 82 58 Z" fill="#52525b" opacity="0.7" />
    <!-- Left Bangs -->
    <path d="M 70 85 C 68 120 74 145 78 152 C 80 148 82 130 82 110 C 82 95 78 88 70 85 Z" fill="#18181b" />
    <path d="M 80 82 C 86 100 90 108 92 106 C 94 98 90 85 85 80 Z" fill="#27272a" />
    <!-- Center Bangs Fringe -->
    <path d="M 88 75 C 98 96 104 102 106 101 C 108 92 102 78 95 72 Z" fill="#18181b" />
    <path d="M 103 72 C 114 97 122 104 124 102 C 126 92 120 76 112 70 Z" fill="#27272a" />
    <path d="M 122 71 C 132 96 140 101 142 99 C 143 90 136 76 128 70 Z" fill="#18181b" />
    <!-- Right Bangs -->
    <path d="M 170 85 C 172 120 166 145 162 152 C 160 148 158 130 158 110 C 158 95 162 88 170 85 Z" fill="#18181b" />
    <path d="M 160 82 C 154 100 150 108 148 106 C 146 98 150 85 155 80 Z" fill="#27272a" />
  </g>

  <!-- Cyan Hairpin Accessory -->
  <path d="M 74 74 L 84 66" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 74 66 L 84 74" stroke="#082b59" stroke-width="2.5" stroke-linecap="round" />
</svg>
